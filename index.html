<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>British Dictation Checker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'%3E%3CclipPath id='t'%3E%3Cpath d='M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z'/%3E%3C/clipPath%3E%3Cpath d='M0,0 v30 h60 v-30 z' fill='%23012169'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23fff' stroke-width='6'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' clip-path='url(%23t)' stroke='%23C8102E' stroke-width='4'/%3E%3Cpath d='M30,0 v30 M0,15 h60' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M30,0 v30 M0,15 h60' stroke='%23C8102E' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrapper">

  <header>
    <div class="crest">
      <svg class="union-flag" viewBox="0 0 60 30" role="img" aria-label="Union Flag">
        <clipPath id="uj-clip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
        <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uj-clip)" stroke="#C8102E" stroke-width="4"/>
        <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
        <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
      </svg>
      <span class="crest-text">British English</span>
    </div>
    <h1>Dictation Checker</h1>
    <p class="tagline">Spelling &amp; transcription, marked to British standards</p>
  </header>

  <!-- Student info -->
  <div class="card" id="setup-card">
    <p class="card-title">Student Info</p>
    <div class="fields-row">
      <div class="field-group">
        <label for="student-name">Student Name</label>
        <input type="text" id="student-name" placeholder="e.g. Maria Silva" autocomplete="off">
      </div>
      <div class="field-group">
        <label for="dictation-num">Dictation Number</label>
        <select id="dictation-num">
          <option value="">— select —</option>
          <option value="118">Dictation 118</option>
          <option value="119">Dictation 119</option>
          <option value="120">Dictation 120</option>
          <option value="121">Dictation 121</option>
          <option value="122">Dictation 122</option>
          <option value="123">Dictation 123</option>
          <option value="124">Dictation 124</option>
          <option value="125">Dictation 125</option>
          <option value="126">Dictation 126</option>
          <option value="127">Dictation 127</option>
          <option value="128">Dictation 128</option>
          <option value="129">Dictation 129</option>
          <option value="130">Dictation 130</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Dictation input -->
  <div class="card">
    <p class="card-title">Student's Dictation</p>
    <div class="field-group">
      <label for="student-text">Type what you heard</label>
      <textarea id="student-text" placeholder="Type the dictation here exactly as you heard it…"></textarea>
    </div>
    <button class="btn-check" onclick="checkDictation()">Check Dictation</button>
    <button class="btn-reset" onclick="resetAll()">Start Over</button>
  </div>

  <!-- Results -->
  <div class="card" id="results">
    <p class="card-title">Results</p>

    <div class="student-header">
      <span>Student</span>
      <span id="res-name">—</span>
      &nbsp;·&nbsp;
      <span>Dictation</span>
      <span id="res-num">—</span>
    </div>

    <div id="grade-badge" class="grade-label grade-b">—</div>

    <div class="score-banner">
      <div class="score-stat stat-wrong">
        <span class="num" id="wrong-words">0</span>
        <span class="lbl">Errors</span>
      </div>
    </div>

    <p class="diff-title">Comparison — Reference vs Student</p>
    <div class="diff-text" id="diff-output"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld-err"></div> Wrong word</div>
      <div class="legend-item"><div class="legend-dot ld-miss"></div> Missing word</div>
      <div class="legend-item"><div class="legend-dot ld-extra"></div> Extra word</div>
    </div>
  </div>

  <footer class="page-footer">Set in Baskerville · British English spelling throughout</footer>

</div>
<script src="app.js"></script>
</body>
</html>
